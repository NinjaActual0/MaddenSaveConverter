name: Publish framework-dependent Windows build

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  issues: write
  checks: write
  # grant minimal permission for uploads; GITHUB_TOKEN will be used

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent win-x64
        run: |
          dotnet publish MaddenSaveConverter.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishTrimmed=false -o publish/win-x64

      - name: Zip publish folder
        run: |
          powershell -Command "New-Item -ItemType Directory -Path build -Force | Out-Null; Compress-Archive -Path publish/win-x64\* -DestinationPath build/MaddenSaveConverter-win-x64.zip -Force"

      - name: Upload artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: publish-zip
          path: build/MaddenSaveConverter-win-x64.zip

      - name: Install GitHub CLI
        uses: cli/gh-action@v3

      - name: Upload release asset with gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Authenticate gh with the GITHUB_TOKEN and upload the zip to the release
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          gh release upload "$RELEASE_TAG" build/MaddenSaveConverter-win-x64.zip --clobber
